name: Core tests

on:
  push:
    branches: [main]
    paths:
      - "Core/**"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "Core/**"
      - ".github/workflows/core-tests.yml"

jobs:
  test:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      # Every test is offline now that fetching lives behind a plugin the tests stub,
      # so there is nothing left to filter out.
      - name: Run tests
        working-directory: Core
        run: swift test
